services:
  db:
    image: postgres:16-alpine
    container_name: mindbridge_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4kt!
      POSTGRES_DB: mindbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: mindbridge_backend
    restart: always
    depends_on:
      - db
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mindbridge
      DB_ADMIN_DATABASE: postgres
      DB_USER: postgres
      DB_PASSWORD: 4kt!
      JWT_SECRET: C9859DF38BF984FA2363AAEB92B7C0BC6F45BAD0036C750889EC302B6CD15826750F4AB43615DFC343BB2573D2A4148581E9A6421E619EA64099AABD6AC97967
      JWT_EXPIRES_IN: 7d
      TOGETHER_API_KEY: tgp_v1_C6WtuxV0MInPLodeNWJVbhF20Z8JDDWmp7oFt3ypezA
      TOGETHER_MODEL: openai/gpt-oss-20b
      COMPRESSION_THRESHOLD: 20
      CONTEXT_WINDOW: 10
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../mindbridge-frontend
    container_name: mindbridge_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: