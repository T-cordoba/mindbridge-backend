apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindbridge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/T-cordoba/mindbridge-backend.git
    targetRevision: gestion
    path: k8s
    directory:
      recurse: true
      exclude: '{**/secret.example.yaml,**/*.md,argocd/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: mindbridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
