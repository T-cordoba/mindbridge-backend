apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindbridge-backend
  namespace: mindbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindbridge-backend
  template:
    metadata:
      labels:
        app: mindbridge-backend
    spec:
      initContainers:
        - name: migrate
          image: tcordoba24/mindbridge-backend:latest
          imagePullPolicy: Never
          command: ["npm", "run", "migrate"]
          envFrom:
            - secretRef:
                name: backend-secret
      containers:
        - name: backend
          image: tcordoba24/mindbridge-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
