apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindbridge-backend
  namespace: mindbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindbridge-backend
  template:
    metadata:
      labels:
        app: mindbridge-backend
    spec:
      containers:
        - name: backend
          image: tcordoba24/mindbridge-backend:latest
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: mindbridge-backend
  namespace: mindbridge
spec:
  selector:
    app: mindbridge-backend
  ports:
    - port: 4000
      targetPort: 4000