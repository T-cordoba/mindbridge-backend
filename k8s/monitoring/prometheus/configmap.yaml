apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mindbridge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'mindbridge-backend'
        static_configs:
          - targets: ['mindbridge-backend:4000']
        metrics_path: /api/metrics
