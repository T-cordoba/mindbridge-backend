apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
  namespace: mindbridge
data:
  mindbridge-backend.json: |
    {
      "title": "MindBridge Backend",
      "uid": "mindbridge-backend",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (route)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "p95 latency (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests by status code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (status_code)",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Process memory (RSS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"mindbridge-backend\"}",
              "legendFormat": "RSS",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Event loop lag (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "nodejs_eventloop_lag_seconds{job=\"mindbridge-backend\"}",
              "legendFormat": "lag",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "up{job=\"mindbridge-backend\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
