# BACKEND_INTERNAL_URL se evalua en build-time (queda fijo en routes-manifest.json de Next.js).
# La imagen se buildea y publica automaticamente via GitHub Actions (.github/workflows/ci.yml)
# con --build-arg BACKEND_INTERNAL_URL=http://mindbridge-backend:4000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindbridge-frontend
  namespace: mindbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindbridge-frontend
  template:
    metadata:
      labels:
        app: mindbridge-frontend
    spec:
      containers:
        - name: frontend
          image: tcordoba24/mindbridge-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
